# Wrangler configuration for the ask widget's Worker (/api/ask)
# Generated from wrangler-ask.toml.template -- {{TOKENS}} are substituted
# from gendoc.yml values by scripts/setup.sh. Do not edit the generated
# file; edit gendoc.yml.
#
# This is a WORKER, deployed separately from the Pages site:
#   gendoc-template/scripts/setup.sh
# Secrets are set once, manually (never in any config file):
#   wrangler secret put GEMINI_API_KEY     --name genius-cognitive-system-docs-ask
#   wrangler secret put OPENROUTER_API_KEY --name genius-cognitive-system-docs-ask
# Either provider may be omitted (no key = skipped in the chain).

name = "genius-cognitive-system-docs-ask"
main = "worker/ask.js"
compatibility_date = "2024-01-01"

[vars]
LLMS_URL = "/llms.txt"
ALLOWED_ORIGINS = "https://docs.gnus.ai,https://gcs.gnus.ai"
SITE_URL = "https://docs.gnus.ai"
BOT_NAME = "Super Genius Assistant"
PROVIDERS = "openrouter,gemini"
GEMINI_MODEL = "gemini-2.5-flash"
OPENROUTER_MODELS = "nvidia/nemotron-3-super-120b-a12b:free,nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3-nano-30b-a3b:free"

[[routes]]
pattern = "ask.gnus.ai/api/*"
zone_name = "gnus.ai"
