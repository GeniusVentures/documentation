# gendoc.yml — GNUS.AI Documentation configuration
# See gendoc-template/gendoc.yml.example for the full schema reference.

# ── Project identification ──────────────────────────────────────────────────
project:
  name: "GNUS.AI Docs"
  logo: "./gnus-ai-logo.png"
  number: "0.1"
  brief: "GNUS.AI Network — decentralized AI compute platform documentation"
  generator: false

# ── Paths (relative to this file's location — the host project root) ──
paths:
  handwritten_docs: "docs"
  exclude_patterns:
    - "*/supergenius/*"

# ── MkDocs configuration ────────────────────────────────────────────────────
mkdocs:
  use_directory_urls: true
  strict: false

# ── Theme selection ──────────────────────────────────────────────────────────
theme:
  name: "indigo"                               # themes/<name>.css — any file in themes/; "default" is fallback

# ── Doxygen configuration (required by build.sh, unused for docs-only site) ──
doxygen:
  output_dir: "gendoc-template/doxygen-output"
  generate_xml: true
  generate_html: false
  recursive: true
  strip_from_path: ""
  full_path_names: false

# ── Source references ──────────────────────────────────────────────────────
source_references:
  - name: "supergenius"
    label: "⌨️ SuperGenius Code"
    language: "C++"
    source:
      - "../SuperGenius/src"
      - "../SuperGenius/example"
      - "../SuperGenius/ProofSystem/include"
      - "../SuperGenius/ProofSystem/src"
      - "../SuperGenius/ProofSystem/SGProofCircuits/src"
      - "../SuperGenius/ProofSystem/SGProofCircuits/include"
      - "../SuperGenius/SGProcessingManager/include"
      - "../SuperGenius/SGProcessingManager/src"
      - "../SuperGenius/gRPCForSuperGenius/proto-include"
      - "../SuperGenius/GeniusKDF/src"
      - "../SuperGenius/evmrelay/src"
      - "../SuperGenius/evmrelay/include"
      - "../SuperGenius/evmrelay/examples"
    file_patterns:
      - "*.c"
      - "*.cc"
      - "*.cpp"
      - "*.cxx"
      - "*.d"
      - "*.h"
      - "*.hh"
      - "*.hpp"
      - "*.hxx"
      - "*.ipp"
      - "*.inc"
      - "*.java"
      - "*.markdown"
      - "*.md"
      - "*.php"
      - "*.py"
    output_subdir: "SuperGenius"
    base_url: "/SuperGenius/"

# ── Navigation ────────────────────────────────────────────────────────────────
navigation:
  generate_index: false
  section_index: false
  navigation_indexes: false
  sections:
    - label: "Documentation"
      source_file: "SUMMARY.md"
      extract_heading: ""
      gitbook: true

# ── Deploy (Cloudflare Pages via Wrangler) ──────────────────────────────────
deploy:
  cloudflare:
    pages_project_name: "gnus-ai-docs"
    compatibility_date: "2024-01-01"
    production_branch: "main"
    branch: "main"
    custom_domain: "docs.gnus.ai"

# ── LLMs / Ask AI ──────────────────────────────────────────────────────────
llms:
  enabled: true
  site_url: "https://docs.gnus.ai"
  corpus_cache: "llms-corpus"
  meta_file: "llms-meta.json"

  audiences:
    llms-technical.txt:
      title: "GNUS.AI Technical Reference"
      categories: [technical, architecture, api, blockchain]

  related_catalogs:
    - url: "https://gcs.gnus.ai/llms.txt"
      title: "Genius Cognitive System"
      description: "Distributed cognitive platform documentation"
      audiences: [llms-technical.txt]

  ask:
    enabled: true
    title: "Ask AI"
    endpoint: "https://ask.gnus.ai/api/ask"
    allowed_origins:
      - "https://docs.gnus.ai"
    providers: "openrouter,gemini"
    gemini_model: "gemini-2.5-flash"
    openrouter_models: "nvidia/nemotron-3-super-120b-a12b:free,nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3-nano-30b-a3b:free"
