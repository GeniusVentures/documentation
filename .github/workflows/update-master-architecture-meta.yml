name: Update master architecture metadata

on:
  push:
    branches:
      - docs/master-platform-architecture
    paths:
      - MASTER_ARCHITECTURE.md
      - .github/workflows/update-master-architecture-meta.yml

permissions:
  contents: write

jobs:
  update-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/master-platform-architecture

      - name: Insert and validate llms-meta entry
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          document = Path("MASTER_ARCHITECTURE.md")
          metadata = Path("llms-meta.json")

          content = document.read_text(encoding="utf-8")
          catalog = json.loads(metadata.read_text(encoding="utf-8"))
          docs = catalog.setdefault("docs", {})
          docs["docs:MASTER_ARCHITECTURE.md"] = {
              "hash": hashlib.sha256(content.encode("utf-8")).hexdigest()[:16],
              "description": "How do the GNUS.ai repositories, runtime, SDKs, wallet, Unity integration, cognitive system, contracts, proofs, dependencies, and sample applications fit together, and which repository owns each type of change?",
              "category": "architecture",
              "optional": False,
              "exclude": False,
              "nav_section": "🖥️ Technical Information",
              "pinned": True,
          }

          metadata.write_text(
              json.dumps(catalog, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          # Parse the serialized result again so malformed output fails the job.
          json.loads(metadata.read_text(encoding="utf-8"))
          PY

      - name: Commit metadata update
        run: |
          if git diff --quiet -- llms-meta.json; then
            echo "llms-meta.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms-meta.json
          git commit -m "docs: catalog master platform architecture"
          git push
